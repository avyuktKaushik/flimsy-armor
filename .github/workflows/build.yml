name: Build plugin

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build
        run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: FlimsyArmor
          path: target/FlimsyArmor.jar
